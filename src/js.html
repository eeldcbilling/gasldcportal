<script>
/* js.html - shared browser code: helpers, icons, server calls, toast, searchable dropdown (combo),
   pop-up (modal), data table, bill PDF view/download, theme, ripple.
   Everything is kept in one object "UI" that the pages (jsPages.html) use. */
var UI = (function () {
  'use strict';

  // ---------- small helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ico = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isNum = v => v !== null && v !== undefined && v !== '' && !isNaN(Number(v));
  // Rupees with Indian grouping, up to 2 decimals; empty value -> dash
  const inr = n => isNum(n) ? '₹ ' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '—';
  const num = n => isNum(n) ? Number(n).toLocaleString('en-IN', { maximumFractionDigits: 3 }) : '—';
  // ISO date (yyyy-mm-dd...) -> dd/mm/yyyy; empty -> dash
  const dmy = iso => iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '—';
  const dmyt = iso => iso ? dmy(iso) + ' ' + String(iso).slice(11, 16) : '—';
  const initials = s => String(s || '').replace(/^\d+\s*-\s*/, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

  // Call a server function (Code.gs etc.) and get a Promise back.
  function run(fn, ...args) {
    return new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...args));
  }
  const errText = e => (e && e.message ? e.message : String(e)).replace(/^Exception:\s*/, '').replace(/^Error:\s*/, '');

  // Add a feedback class (is-success / is-error), remove it again when the animation ends.
  function flash(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth; // restart the animation
    el.classList.add(cls);
    const off = () => el.classList.remove(cls);
    el.addEventListener('animationend', off, { once: true });
    setTimeout(off, 900); // fallback when motion is reduced
  }

  function toast(title, text, kind = 'ok') {
    const box = $('#toasts');
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.innerHTML = `<span class="t-ico">${ico(kind === 'ok' ? 'check' : kind === 'err' ? 'x' : kind === 'warn' ? 'alert' : 'info')}</span>
      <div><b>${esc(title)}</b>${text ? esc(text) : ''}</div>`;
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, kind === 'err' || kind === 'warn' ? 6000 : 3400);
  }

  // Spinner on a button while a promise runs.
  async function busy(btn, promise, label = 'Please wait…') {
    const html = btn.innerHTML;
    btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
    btn.innerHTML = `<span class="spinner" aria-hidden="true"></span><span>${label}</span>`;
    try { return await promise; } finally { btn.removeAttribute('aria-busy'); btn.disabled = false; btn.innerHTML = html; }
  }

  // ---------- icons (inline SVG sprite, no icon library needed) ----------
  const ICONS = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    card: '<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
    sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
    search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
    alert: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    checkc: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
    rupee: '<path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/>',
    pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
    arrow: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
    zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    chev: '<polyline points="6 9 12 15 18 9"/>',
    left: '<polyline points="15 18 9 12 15 6"/>',
    right: '<polyline points="9 18 15 12 9 6"/>',
    eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    columns: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    trend: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
    tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  };
  function injectSprite() {
    const syms = Object.entries(ICONS).map(([k, v]) =>
      `<symbol id="i-${k}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${v}</symbol>`).join('');
    document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true">${syms}</svg>`);
  }

  // Highlight the typed words inside a text (safe: text is escaped piece by piece).
  function highlight(text, words) {
    text = String(text == null ? '' : text);
    const low = text.toLowerCase(), marks = [];
    words.forEach(w => { const i = low.indexOf(w); if (w && i >= 0) marks.push([i, i + w.length]); });
    marks.sort((a, b) => a[0] - b[0]);
    let out = '', pos = 0;
    marks.forEach(([s, e]) => { if (s < pos) s = pos; if (e <= s) return; out += esc(text.slice(pos, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>'; pos = e; });
    return out + esc(text.slice(pos));
  }

  // ---------- searchable dropdown ----------
  // UI.combo(host, { id, label, placeholder, items(), text(item), sub(item), tag(item), avatar(item), onPick(item|null) })
  let comboSeq = 0;
  function combo(host, o) {
    const id = o.id || ('cb' + (++comboSeq));
    host.innerHTML = `<div class="combo">
      <input id="${id}" class="input" role="combobox" aria-expanded="false" aria-controls="${id}-list" aria-autocomplete="list" autocomplete="off" placeholder="${esc(o.placeholder || 'Type to search')}">
      <button type="button" class="icon-button combo-clear" aria-label="Clear ${esc(o.label || 'selection')}" hidden>${ico('x')}</button>
      <ul class="combo-list" id="${id}-list" role="listbox" aria-label="${esc(o.label || 'Options')}"></ul></div>`;
    const root = $('.combo', host), input = $('input', root), list = $('ul', root), clear = $('.combo-clear', root);
    const LIMIT = 60;
    let shown = [], active = -1, picked = null;

    function render() {
      const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
      const all = o.items();
      const match = all.filter(it => {
        const hay = (o.text(it) + ' ' + (o.sub ? o.sub(it) : '') + ' ' + (o.tag ? o.tag(it) : '')).toLowerCase();
        return words.every(w => hay.includes(w));
      });
      shown = match.slice(0, LIMIT);
      if (active >= shown.length) active = shown.length - 1;
      list.innerHTML = shown.length ? shown.map((it, i) => `<li class="opt" role="option" id="${id}-o${i}" data-i="${i}" aria-selected="${i === active}">
          ${o.avatar ? `<span class="opt-av" aria-hidden="true">${esc(o.avatar(it))}</span>` : ''}
          <span class="opt-main"><span>${highlight(o.text(it), words)}</span>${o.sub ? `<small>${highlight(o.sub(it), words)}</small>` : ''}</span>
          ${o.tag && o.tag(it) ? `<span class="opt-tag">${esc(o.tag(it))}</span>` : ''}</li>`).join('')
        : '<li class="none" role="option" aria-disabled="true">No match - try fewer letters</li>';
      list.insertAdjacentHTML('beforeend', `<li class="combo-count" aria-hidden="true">${match.length > LIMIT ? `Showing ${LIMIT} of ${match.length} - keep typing` : `${match.length} of ${all.length}`}</li>`);
      input.setAttribute('aria-activedescendant', active >= 0 ? `${id}-o${active}` : '');
      const a = $(`#${id}-o${active}`); if (a) a.scrollIntoView({ block: 'nearest' });
    }
    function open() { if (input.disabled) return; root.classList.add('open'); input.setAttribute('aria-expanded', 'true'); render(); }
    function close() { root.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); active = -1; }
    function pick(i) {
      const it = shown[i]; if (!it) return;
      set(it); close(); flash(input, 'is-picked'); o.onPick(it);
    }
    function set(it) {
      picked = it || null;
      input.value = it ? o.text(it) : '';
      clear.hidden = !it;
    }
    input.addEventListener('focus', () => { input.select(); open(); });
    input.addEventListener('input', () => {
      active = 0; clear.hidden = !input.value; open();
      if (picked) { picked = null; o.onPick(null); }
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (!root.classList.contains('open')) open(); active = Math.min(active + 1, shown.length - 1); render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); render(); }
      else if (e.key === 'Enter' && root.classList.contains('open')) { e.preventDefault(); pick(active >= 0 ? active : 0); }
      else if (e.key === 'Escape') { close(); }
    });
    list.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
    input.addEventListener('blur', () => setTimeout(close, 150));
    clear.addEventListener('click', () => { set(null); o.onPick(null); input.focus(); });
    return {
      set,
      get: () => picked,
      enable(on, placeholder) { input.disabled = !on; if (placeholder) input.placeholder = placeholder; if (!on) set(null); },
      focus: () => input.focus(),
    };
  }

  // ---------- pop-up ----------
  function modal(title, bodyHtml) {
    const d = document.createElement('dialog');
    d.className = 'modal';
    d.setAttribute('aria-labelledby', 'mdl-h');
    d.innerHTML = `<div class="modal-head"><h3 id="mdl-h">${esc(title)}</h3><button type="button" class="icon-button" data-close aria-label="Close">${ico('x')}</button></div><div class="modal-body">${bodyHtml}</div>`;
    document.body.appendChild(d);
    d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
    d.addEventListener('close', () => d.remove());
    d.showModal();
    return d;
  }

  // ---------- bill PDF (file stays private in Drive; the server sends its bytes) ----------
  function b64Blob(b64) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: 'application/pdf' });
  }
  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  // mode 'view' opens a new tab, 'download' saves the file. btn gets a spinner.
  async function pdf(consumer, month, billNo, mode, btn) {
    // the new tab must be opened straight away (inside the click), otherwise the browser blocks it
    const w = mode === 'view' ? window.open('', '_blank') : null;
    if (w) w.document.write('<p style="font:16px system-ui;padding:2rem">Loading bill…</p>');
    try {
      const f = await busy(btn, run('getBillPdf', consumer, month, billNo), mode === 'view' ? 'Opening…' : 'Preparing…');
      const blob = b64Blob(f.data);
      if (w) { w.location.href = URL.createObjectURL(blob); }
      else { saveBlob(blob, f.name); toast('Download started', ' ' + f.name); }
      flash(btn, 'is-success');
    } catch (e) {
      if (w) w.close();
      flash(btn, 'is-error'); toast('Could not get the bill', ' ' + errText(e), 'err');
    }
  }

  // ---------- data table ----------
  // new UI.DataTable(host, { columns: [{ key, label, num, html(row), text(row), sort(row), hidden, nosort }],
  //   rowId(row), selectable, pageSize, title, exportName, emptyText })
  function DataTable(host, opt) {
    this.host = host; this.o = opt;
    this.rows = []; this.q = ''; this.page = 0; this.size = opt.pageSize || 10;
    this.sortKey = opt.sortKey || null; this.sortDir = opt.sortDir || 'desc';
    this.sel = new Set(); this.flashIds = new Set();
    this.hidden = new Set(opt.columns.filter(c => c.hidden).map(c => c.key));
    this.uid = 'dt' + (++comboSeq);
    this.build();
  }
  DataTable.prototype.text = function (c, r) { return c.text ? c.text(r) : String(r[c.key] == null ? '' : r[c.key]); };
  DataTable.prototype.cols = function () { return this.o.columns.filter(c => !this.hidden.has(c.key)); };
  DataTable.prototype.build = function () {
    const o = this.o, u = this.uid;
    this.host.innerHTML = `
      <div class="toolbar dt-tools">
        <div class="search grow">${ico('search')}<input class="input" type="search" placeholder="Search in table" aria-label="Search in ${esc(o.title || 'table')}"></div>
        <label class="sr" for="${u}-size">Rows per page</label>
        <select id="${u}-size" class="input select" data-size>${[10, 20, 30, 0].map(n => `<option value="${n}"${n === this.size ? ' selected' : ''}>${n ? n + ' rows' : 'All rows'}</option>`).join('')}</select>
        <div class="dt-cols"><button type="button" class="icon-button" data-cols aria-label="Show or hide columns" aria-expanded="false">${ico('columns')}</button>
          <div class="dt-cols-menu">${o.columns.map(c => `<label><input type="checkbox" data-col="${c.key}"${this.hidden.has(c.key) ? '' : ' checked'}> ${esc(c.label)}</label>`).join('')}</div></div>
        <button type="button" class="button ghost sm" data-csv>${ico('download')} <span>Export CSV</span></button>
      </div>
      <div class="table-wrap"><table class="tbl"><caption class="sr">${esc(o.title || '')}</caption><thead></thead><tbody></tbody></table></div>
      <div class="table-foot"><span data-info></span><div class="pager" data-pager></div></div>`;
    const h = this.host;
    $('input[type=search]', h).addEventListener('input', e => { this.q = e.target.value.toLowerCase().trim(); this.page = 0; this.draw(); });
    $('[data-size]', h).addEventListener('change', e => { this.size = +e.target.value; this.page = 0; this.draw(); });
    const colsBox = $('.dt-cols', h), colsBtn = $('[data-cols]', h);
    colsBtn.addEventListener('click', () => { const on = colsBox.classList.toggle('open'); colsBtn.setAttribute('aria-expanded', String(on)); });
    document.addEventListener('click', e => { if (!colsBox.contains(e.target)) { colsBox.classList.remove('open'); colsBtn.setAttribute('aria-expanded', 'false'); } });
    $$('[data-col]', h).forEach(cb => cb.addEventListener('change', () => {
      if (cb.checked) this.hidden.delete(cb.dataset.col); else this.hidden.add(cb.dataset.col);
      if (this.cols().length === 0) { cb.checked = true; this.hidden.delete(cb.dataset.col); }
      this.draw();
    }));
    $('[data-csv]', h).addEventListener('click', () => this.csv());
    h.addEventListener('click', e => {
      const s = e.target.closest('[data-sort]');
      if (s) {
        const k = s.dataset.sort;
        this.sortDir = this.sortKey === k && this.sortDir === 'asc' ? 'desc' : 'asc';
        this.sortKey = k; this.draw(); return;
      }
      const p = e.target.closest('[data-page]');
      if (p && !p.disabled) { this.page = +p.dataset.page; this.draw(); }
    });
    h.addEventListener('change', e => {
      const t = e.target;
      if (t.matches('[data-selall]')) { this.filtered().forEach(r => t.checked ? this.sel.add(this.id(r)) : this.sel.delete(this.id(r))); this.draw(); }
      else if (t.matches('[data-selrow]')) { if (t.checked) this.sel.add(t.value); else this.sel.delete(t.value); this.draw(); }
    });
  };
  DataTable.prototype.id = function (r) { return String(this.o.rowId(r)); };
  DataTable.prototype.filtered = function () {
    let rows = this.rows;
    if (this.q) {
      const words = this.q.split(/\s+/);
      rows = rows.filter(r => { const hay = this.o.columns.map(c => this.text(c, r)).join(' ').toLowerCase(); return words.every(w => hay.includes(w)); });
    }
    if (this.sortKey) {
      const c = this.o.columns.find(x => x.key === this.sortKey);
      const val = r => c.sort ? c.sort(r) : (c.num ? Number(r[c.key]) || 0 : this.text(c, r).toLowerCase());
      const dir = this.sortDir === 'asc' ? 1 : -1;
      rows = rows.slice().sort((a, b) => { const x = val(a), y = val(b); return x < y ? -dir : x > y ? dir : 0; });
    }
    return rows;
  };
  DataTable.prototype.setRows = function (rows, flashIds) {
    this.rows = rows || [];
    const ids = new Set(this.rows.map(r => this.id(r)));
    [...this.sel].forEach(i => { if (!ids.has(i)) this.sel.delete(i); });
    this.flashIds = new Set(flashIds || []);
    this.draw();
  };
  DataTable.prototype.selected = function () { return this.rows.filter(r => this.sel.has(this.id(r))); };
  DataTable.prototype.draw = function () {
    const o = this.o, h = this.host, cols = this.cols(), rows = this.filtered();
    const size = this.size || rows.length || 1, pages = Math.max(1, Math.ceil(rows.length / size));
    if (this.page >= pages) this.page = pages - 1;
    const start = this.page * size, part = this.size ? rows.slice(start, start + size) : rows;
    const allSel = rows.length > 0 && rows.every(r => this.sel.has(this.id(r)));
    const someSel = rows.some(r => this.sel.has(this.id(r)));

    $('thead', h).innerHTML = '<tr>' + (o.selectable ? `<th class="chk"><input type="checkbox" data-selall aria-label="Select all ${rows.length} rows"${allSel ? ' checked' : ''}></th>` : '') +
      cols.map(c => {
        const sortState = this.sortKey === c.key ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none';
        return `<th${c.num ? ' class="num"' : ''}${c.nosort ? '' : ` aria-sort="${sortState}"`}>${c.nosort ? esc(c.label) : `<button type="button" class="sort" data-sort="${c.key}">${esc(c.label)} ${ico('chev')}</button>`}</th>`;
      }).join('') + '</tr>';
    const sa = $('[data-selall]', h); if (sa) sa.indeterminate = someSel && !allSel;

    $('tbody', h).innerHTML = part.length ? part.map(r => {
      const id = this.id(r), on = this.sel.has(id);
      return `<tr class="${on ? 'is-sel' : ''}${this.flashIds.has(id) ? ' is-new' : ''}">` +
        (o.selectable ? `<td class="chk"><input type="checkbox" data-selrow value="${esc(id)}" aria-label="Select row"${on ? ' checked' : ''}></td>` : '') +
        cols.map(c => `<td class="${c.num ? 'num' : ''}${c.cls ? ' ' + c.cls : ''}">${c.html ? c.html(r) : esc(this.text(c, r))}</td>`).join('') + '</tr>';
    }).join('') : `<tr><td class="empty-row" colspan="${cols.length + (o.selectable ? 1 : 0)}">${esc(this.q ? 'No rows match your search.' : (o.emptyText || 'Nothing here yet.'))}</td></tr>`;
    this.flashIds = new Set();

    const shownTo = this.size ? Math.min(start + size, rows.length) : rows.length;
    $('[data-info]', h).innerHTML = (rows.length ? `Showing ${start + 1}–${shownTo} of ${rows.length}` : 'No rows') +
      (rows.length !== this.rows.length ? ` (filtered from ${this.rows.length})` : '') +
      (this.sel.size ? ` · <span class="sel-info">${this.sel.size} selected</span>` : '');
    $('[data-csv] span', h).textContent = this.sel.size ? `Export ${this.sel.size} selected` : 'Export CSV';

    // pager: first, previous, nearby page numbers, next, last
    const pg = this.page, btn = (p, label, aria, cur) => `<button type="button" class="icon-button" data-page="${p}" aria-label="${aria}"${cur ? ' aria-current="page"' : ''}${p < 0 || p >= pages || (cur === false && p === pg) ? ' disabled' : ''}>${label}</button>`;
    let html = btn(pg - 1, ico('left'), 'Previous page', false);
    const from = Math.max(0, Math.min(pg - 2, pages - 5)), to = Math.min(pages, from + 5);
    if (from > 0) html += btn(0, '1', 'Page 1', 0 === pg) + (from > 1 ? '<span aria-hidden="true">…</span>' : '');
    for (let p = from; p < to; p++) html += btn(p, String(p + 1), 'Page ' + (p + 1), p === pg);
    if (to < pages) html += (to < pages - 1 ? '<span aria-hidden="true">…</span>' : '') + btn(pages - 1, String(pages), 'Page ' + pages, pages - 1 === pg);
    html += btn(pg + 1, ico('right'), 'Next page', false);
    $('[data-pager]', h).innerHTML = pages > 1 ? html : '';
  };
  // CSV of the visible columns: selected rows if any, else all rows that match the search.
  DataTable.prototype.csv = function () {
    const cols = this.cols().filter(c => !c.nocsv);
    const rows = this.sel.size ? this.filtered().filter(r => this.sel.has(this.id(r))) : this.filtered();
    const cell = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [cols.map(c => cell(c.label)).join(',')].concat(rows.map(r => cols.map(c => cell(this.text(c, r))).join(',')));
    saveBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }), (this.o.exportName || 'table') + '.csv');
    toast('CSV ready', ` ${rows.length} rows`);
  };

  // ---------- theme ----------
  function initTheme() {
    const btn = $('#themeBtn');
    const root = document.documentElement;
    try { const s = localStorage.getItem('portal-theme'); if (s) root.dataset.theme = s; } catch (e) { /* storage blocked */ }
    const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const sync = () => {
      btn.innerHTML = ico(dark() ? 'sun' : 'moon');
      btn.setAttribute('aria-label', dark() ? 'Switch to light theme' : 'Switch to dark theme');
    };
    btn.addEventListener('click', () => {
      root.dataset.theme = dark() ? 'light' : 'dark';
      try { localStorage.setItem('portal-theme', root.dataset.theme); } catch (e) { /* ignore */ }
      sync(); flash(btn, 'is-success');
    });
    sync();
  }

  // ---------- click ripple on every clickable element (accent colour, see .ripple in css.html) ----------
  const RIPPLE_ON = '.button, .icon-button, .chip, .seg button, .nav-link, .card, .combo-list li, .act-row';
  document.addEventListener('pointerdown', e => {
    if (reduced()) return;
    const el = e.target.closest(RIPPLE_ON);
    if (!el || el.disabled) return;
    const r = el.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2;
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
    el.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  });

  return { $, $$, ico, esc, inr, num, dmy, dmyt, initials, today, reduced, run, errText, flash, toast, busy,
    injectSprite, combo, modal, pdf, DataTable, initTheme };
})();
</script>
